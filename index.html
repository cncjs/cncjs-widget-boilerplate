<style>
html {
  box-sizing: border-box;
}

  box-sizing: inherit;
}
html {
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light dark;
  color: CanvasText;

  --field-color: #f5f5f5;
  --border-color: #ccc;
  --field-border-color: #e3e3e3;
}

  html {
    --panel-color: #242424;
    --panel-header-color: #303030;
    --field-color: #181818;
    --border-color: #666;
    --field-border-color: #555;
  }
}
pre,
code,
kbd,
samp {
  font-family: "Segoe UI Mono", "SFMono-Medium", "SF Mono", Menlo, Consolas, Courier, monospace;
